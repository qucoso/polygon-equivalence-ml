[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "polygon-equivalence-ml"
version = "0.1.0"
description = "Neural approaches for polygon equivalence learning under geometric uncertainty."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
keywords = [
    "polygon equivalence",
    "geometric uncertainty",
    "graph neural networks",
    "perceiver",
    "metric learning",
    "geo-ai",
    "cartographic generalization",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "geopandas>=1.1.2",
    "joblib>=1.5.3",
    "matplotlib>=3.10.8",
    "matplotlib-scalebar>=0.9.0",
    "mlflow>=1.27.0",
    "numpy>=2.4.2",
    "optuna>=4.7.0",
    "pandas>=3.0.0",
    "pyarrow>=23.0.0",
    "pyproj>=3.7.2",
    "pytorch-metric-learning>=2.9.0",
    "scikit-learn>=1.8.0",
    "shapely>=2.1.2",
    "shapelysmooth>=0.2.1",
    "torch>=2.10.0",
    "torch-geometric>=2.7.0",
    "tqdm>=4.67.3",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["data", "end2end", "featurebased"]

[project.urls]
Repository = "https://github.com/qucoso/polygon-equivalence-ml"
Dataset = "https://www.kaggle.com/datasets/qucoso/geometric-uncertainty-dataset-osm-polygons"